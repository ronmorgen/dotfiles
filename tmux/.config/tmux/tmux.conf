# ==============================================================================
# General Settings
# ==============================================================================

set -g default-shell "$SHELL"
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q' # cursor shape
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g history-limit 100000
set -s escape-time 0
set -sg repeat-time 600
set -s focus-events on
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Window/pane indexing
setw -g pane-base-index 1
setw -g automatic-rename on
setw -g mode-keys vi
set -g base-index 1
set -g renumber-windows on
set -g window-size latest
set -g set-titles on
set -g set-titles-string "#I:#W"

# Timings
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 5

# Notifications
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# ==============================================================================
# Key Bindings
# ==============================================================================

# Unbind default key bindings, we're going to override
unbind r
unbind n

# change prefix key to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# edit configuration and reload
bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} "$TMUX_CONF" && tmux source "$TMUX_CONF" && tmux display \"Config reloaded\"'"

# reload configuration
bind 'r' source-file "$TMUX_CONF" \; display "Reloaded tmux config"

# new window and retain cwd
bind 'c' new-window -c "#{pane_current_path}"

# rename session and window
bind 'r' command-prompt -I "#{window_name}" "rename-window '%%'"
bind 'R' command-prompt -I "#{session_name}" "rename-session '%%'"

# split panes
bind '\' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'

# select pane and windows
bind -r C-[ previous-window
bind -r C-] next-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r Tab last-window   # cycle thru MRU tabs
bind -r C-o swap-pane -D

# resize panes
bind -r 'H' resize-pane -L 1
bind -r 'J' resize-pane -D 1
bind -r 'K' resize-pane -U 1
bind -r 'L' resize-pane -R 1

# zoom pane
bind '+' resize-pane -Z

# kill pane/window/session shortcuts
bind 'x' kill-pane
bind 'X' kill-window
bind 'C'-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind 'Q' confirm-before -p "kill-session #S? (y/n)" kill-session

# clear history
bind -n C-l send-keys C-l
bind C-l clear-history

# Hide status bar on demand
bind C-s if -F '#{s/off//:status}' 'set status off' 'set status on'

# lazygit
bind 'g' display-popup -E -xC -yC -w 80% -h 80% -d '#{pane_current_path}' lazygit

# yazi
bind 'y' display-popup -E -xC -yC -w 90% -h 90% -d '#{pane_current_path}' yazi

# scratchpad
bind '`' display-popup -E -xC -yC -w 60% -h 50% -d '#{pane_current_path}'

# sesh
bind 'K' run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 90%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '❯ ' \
    --preview 'sesh preview {}' \
    --layout reverse --style full \
    --color 'border:blue,label:blue' \
    --color 'preview-border:magenta,preview-label:magenta' \
    --color 'list-border:green,list-label:green' \
    --color 'input-border:red,input-label:red' \
    --color 'info:bright-black,prompt:red,pointer:green' \
    --color 'marker:green,spinner:green,header:green' \
    --header '^a(ll) ^t(mux) ^g configs ^x zoxide ^d kill ^f(ind)' \
    --bind 'ctrl-a:reload(sesh list --icons)' \
    --bind 'ctrl-t:reload(sesh list -t --icons)' \
    --bind 'ctrl-g:reload(sesh list -c --icons)' \
    --bind 'ctrl-x:reload(sesh list -z --icons)' \
    --bind 'ctrl-f:reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)' \
)\""

# ==============================================================================
# Copy Mode
# ==============================================================================

bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# ==============================================================================
# Status Line
# ==============================================================================

set -g status "on"
set -g status-position bottom
set -g status-bg "#2f383e"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# messages
set -g message-style "fg=#83c092,bg=#2f383e,align=centre"
set -g message-command-style "fg=#83c092,bg=#2f383e,align=centre"

# panes
set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=#7fbbb3"

# windows
setw -g window-status-activity-style "fg=#d3c6aa,bg=#2f383e,none"
setw -g window-status-separator ""
setw -g window-status-style "fg=#d3c6aa,bg=#2f383e,none"
setw -g window-status-format '#[fg=#7a8478,bg=#2f383e] #I:#W '
setw -g window-status-current-format '#[fg=#a7c080,bg=#2f383e,bold] #I:#W '

set -g status-left '#[fg=#d3c6aa,bg=#3d484d,bold] #S #[fg=#3d484d,bg=#2f383e]'
set -g status-right "#[fg=#7fbbb3,bg=#2f383e,bold] #(cd #{pane_current_path}; git branch --show-current 2>/dev/null) #[fg=#e69875,bg=#2f383e,bold] #{b:pane_current_path} #[fg=#83c092,bg=#2f383e,bold] %H:%M "
