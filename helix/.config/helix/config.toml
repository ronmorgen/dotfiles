# ── Theme ─────────────────────────────────────────────────────────────

theme = "everforest"

# ── Editor ────────────────────────────────────────────────────────────

[editor]
auto-completion = true
auto-format = false
auto-info = true
auto-save = false
bufferline = "always"
color-modes = true
completion-replace = true
completion-timeout = 5
completion-trigger-len = 1
cursorcolumn = false
cursorline = true
idle-timeout = 10
line-number = "relative"
mouse = true
scroll-lines = 3
scrolloff = 30
shell = ["zsh", "-c"]
text-width = 80
trim-final-newlines = true
trim-trailing-whitespace = true
true-color = true
undercurl = true

# ── Cursor ────────────────────────────────────────────────────────────

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# ── Soft Wrap ─────────────────────────────────────────────────────────

[editor.soft-wrap]
enable = true
# max-wrap = 20
# max-indent-retain = 40

# ── Indent Guides ─────────────────────────────────────────────────────

[editor.indent-guides]
character = "┆"
render = true
skip-levels = 1

# ── Whitespace ────────────────────────────────────────────────────────

[editor.whitespace.render]
nbsp = "none"
newline = "none"
space = "none"
tab = "all"

[editor.whitespace.characters]
nbsp = "⍽"
newline = "⏎"
space = "·"
tab = "→"
tabpad = "·"

# ── Diagnostics ───────────────────────────────────────────────────────

[editor.inline-diagnostics]
cursor-line = "hint"

# ── LSP ───────────────────────────────────────────────────────────────

[editor.lsp]
display-inlay-hints = true
display-messages = true
display-progress-messages = true
snippets = true

# ── File Picker ───────────────────────────────────────────────────────

[editor.file-picker]
git-global = false
git-ignore = true
hidden = false

# ── Statusline ────────────────────────────────────────────────────────

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "read-only-indicator",
  "file-modification-indicator",
  "diagnostics",
]
center = ["file-absolute-path"]
right = [
  "workspace-diagnostics",
  "position",
  "position-percentage",
  "total-line-numbers",
]
mode = { normal = "NOR", insert = "INS", select = "SEL" }
separator = "|"

# ── Keybindings (Normal Mode) ────────────────────────────────────────

[keys.normal]
down = "no_op"
left = "no_op"
right = "no_op"
up = "no_op"

esc = ["collapse_selection", "keep_primary_selection", ":w"]

"," = "repeat_last_motion"

c = ["change_selection_noyank"]
d = ["delete_selection_noyank"]

"{" = ["goto_prev_paragraph"]
"}" = ["goto_next_paragraph"]

H = "goto_line_start"
L = "goto_line_end"
J = "goto_next_paragraph"
K = "goto_prev_paragraph"

"n" = ["search_next", "align_view_center"]
"N" = ["search_prev", "align_view_center"]

"#" = "@miw/<C-r>.<ret>"
"@" = "@miw<space>/<C-r>."

"X" = ["extend_line_up", "extend_to_line_bounds"]

"A-d" = ["page_cursor_half_down", "align_view_center"]
"A-u" = ["page_cursor_half_up", "align_view_center"]

A-down = [
  "extend_to_line_bounds",
  "yank",
  "open_below",
  "normal_mode",
  "replace_with_yanked",
  "collapse_selection",
]
A-up = [
  "extend_to_line_bounds",
  "yank",
  "open_above",
  "normal_mode",
  "replace_with_yanked",
  "collapse_selection",
]

# Move line up/down
"A-j" = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_down",
  "paste_before",
  "collapse_selection",
]
"A-k" = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
  "collapse_selection",
]


[keys.normal.space]
"q" = [":q"]
Q = [":q!"]
x = [":bc"]
X = [":bc!"]

# Yazi
e = [
  ':sh rm -f /tmp/hx-yazi-chooser',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/hx-yazi-chooser',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/hx-yazi-chooser}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]

# LazyGit
g = [":write-all", ":insert-output lazygit >/dev/tty", ":redraw", ":reload-all"]

# Scooter
s = [
  ":write-all",
  ":insert-output scooter --no-stdin >/dev/tty",
  ":redraw",
  ":reload-all",
  ':set mouse false',
  ':set mouse true',
]

[keys.normal.space.","]
"c" = ":config-open"
"l" = ":open ~/.config/helix/languages.toml"
"r" = ":config-reload"

# ── Keybindings (Insert Mode) ────────────────────────────────────────

[keys.insert]
down = "no_op"
left = "no_op"
right = "no_op"
up = "no_op"

C-a = "insert_at_line_start"
C-e = "insert_at_line_end"
C-b = "move_char_left"
C-f = "move_char_right"
C-c = "signature_help"

# ── Keybindings (Select Mode) ────────────────────────────────────────

[keys.select]
down = "no_op"
left = "no_op"
right = "no_op"
up = "no_op"

"{" = ["goto_prev_paragraph"]
"}" = ["goto_next_paragraph"]
