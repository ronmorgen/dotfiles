# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json
sources:
  skills: /Users/ronm/.config/skillshare/skills
  agents: /Users/ronm/.config/skillshare/agents
mode: merge
targets:
  claude:
    skills:
      path: /Users/ronm/.claude/skills
  codex:
    skills:
      path: /Users/ronm/.codex/skills

extras:
  - name: rules
    targets:
      - path: ~/.claude/rules

ignore:
  - .DS_Store
  - .git/
  - __pycache__/

audit:
  block_threshold: CRITICAL
