# ==============================================================================
# General Settings
# ==============================================================================

set -g default-shell "$SHELL"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',xterm-ghostty:Ss=\E[%p1%d q:Se=\E[2 q'
set -as terminal-features ',xterm-ghostty:RGB:extkeys,xterm-256color:RGB'  # true color + extended keys

set -g extended-keys on

set -g history-limit 100000
set -s escape-time 0
set -sg repeat-time 600
set -s focus-events on
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Window/pane indexing
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g automatic-rename on
set -g base-index 1
set -g renumber-windows on
set -g window-size latest
set -g set-titles on
set -g set-titles-string "#I:#W"

# Timings
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 5

# Notifications
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# ==============================================================================
# Key Bindings
# ==============================================================================

# Unbind default key bindings, we're going to override
unbind r
unbind n

# change prefix key to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# edit configuration and reload
bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} "$TMUX_CONF" && tmux source "$TMUX_CONF" && tmux display \"Config reloaded\"'"

# reload configuration
bind 'r' source-file "$TMUX_CONF" \; display "Reloaded tmux config"

# new window and retain cwd
bind 'c' new-window -c "#{pane_current_path}"

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

# rename session
bind c-R command-prompt -I "#{session_name}" "rename-session '%%'"

# split panes
bind '\' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'

# select pane and windows
bind -r C-] next-window
bind -r [ select-pane -t :.-
bind -r ] select-pane -t :.+
bind -r Tab last-window   # cycle thru MRU tabs
bind -r C-o swap-pane -D

# resize panes
bind -r 'H' resize-pane -L 1
bind -r 'J' resize-pane -D 1
bind -r 'K' resize-pane -U 1
bind -r 'L' resize-pane -R 1

# zoom pane
bind '+' resize-pane -Z

# kill pane/window/session shortcuts
bind 'x' kill-pane
bind 'X' kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind 'Q' confirm-before -p "kill-session #S? (y/n)" kill-session

# clear history
bind C-l clear-history

# lazygit
bind 'g' display-popup -E -xC -yC -w 80% -h 80% -d '#{pane_current_path}' lazygit

# scratchpad
bind '`' display-popup -E -xC -yC -w 60% -h 50% -d '#{pane_current_path}'

# ==============================================================================
# Session Picker (sesh)
# ==============================================================================

# Open or create session
bind-key ";" run-shell "sesh connect \"$(
  sesh list -c --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --layout reverse --info inline-right \
    --border rounded --border-label ' sesh ' --border-label-pos 3 \
    --prompt '⚙️  ' --pointer '▌' --marker '▌' \
    --header '^g configs  ^a all  ^t tmux  ^x zoxide  ^f find  ^d kill' \
    --header-first \
    --color 'bg:#2d353b,bg+:#3d484d,fg:#9da9a0,fg+:#d3c6aa,hl:#a7c080,hl+:#a7c080' \
    --color 'border:#475258,label:#7fbbb3,header:#7a8478,info:#dbbc7f' \
    --color 'prompt:#7fbbb3,pointer:#e67e80,marker:#83c092,spinner:#e69875' \
    --color 'gutter:#2d353b,separator:#475258,scrollbar:#475258,preview-border:#475258' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons -d)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --preview-window 'right,55%,border-left' \
    --preview '~/.config/tmux/scripts/sesh-preview.sh {} {2..}'
)\""

# ==============================================================================
# Copy Mode
# ==============================================================================

bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# ==============================================================================
# Colorscheme
# ==============================================================================

set -g status "on"
set -g status-position bottom
set -g status-bg "#2f383e"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# messages
set -g message-style "fg=#83c092,bg=#2f383e,align=centre"
set -g message-command-style "fg=#83c092,bg=#2f383e,align=centre"

# popups
set -g popup-style "fg=#d3c6aa,bg=#2d353b"
set -g popup-border-style "fg=#475258,bg=#2d353b"
set -g popup-border-lines rounded

# panes
set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=#7fbbb3"

# windows
setw -g window-status-activity-style "fg=#d3c6aa,bg=#2f383e,none"
setw -g window-status-separator ""
setw -g window-status-style "fg=#d3c6aa,bg=#2f383e,none"
setw -g window-status-format '#[fg=#7a8478,bg=#2f383e] #I:#W '
setw -g window-status-current-format '#[fg=#a7c080,bg=#3d484d,bold] #I:#W#{?window_zoomed_flag, 󰁌,} '
setw -g window-status-bell-style "fg=#e67e80,bg=#2f383e,bold"

# session name turns red while the prefix is pressed
set -g status-left '#[fg=#d3c6aa,bold]#{?client_prefix,#[bg=#e67e80],#[bg=#3d484d]} #S #[bg=#2f383e] '
set -g status-right "#[fg=#7fbbb3,bg=#2f383e,bold] #(git -C #{q:pane_current_path} branch --show-current 2>/dev/null) #[fg=#e69875,bg=#2f383e,bold] #{b:pane_current_path} #[fg=#83c092,bg=#2f383e,bold] %H:%M "

# ================================================================
# Plugins
# ================================================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
